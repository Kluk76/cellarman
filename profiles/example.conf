# -----------------------------------------------------------------------------
# profiles/example.conf - a worked EXAMPLE profile for the cellarman PM kernel.
# This file is the ONLY place project nouns are allowed - the kernel itself
# never contains one. POSIX sh only - sources under macOS bash 3.2 and bash 5.
# Copy this file, rename it, replace every "acme" value. The kernel maps this
# profile's PF_*/PM_*/DEV_* vocabulary onto its own internal working
# variables - see each script's "profile -> internal" mapping block near its
# top for the authoritative list of what it reads.
# -----------------------------------------------------------------------------

PROFILE_NAME="acme"
PROFILE_SCHEMA_VERSION="1"
PROFILE_UPDATED="2026-08-19"

# == 1. TEAM ==
# Who exists, how a change is attributed, who rules what ("domain" = arbitration routing key, not a job title).
# DEV_<id>: <display-name>|<vcs author regex>|<domains they RULE on>

DEVS="a b"
DEV_a="Alex Rivera|^Alex Rivera$|billing ops infra fiscal"
DEV_b="Bao Nguyen|^Bao Nguyen$|frontend ui design"

DEV_ENV_VAR="ACME_DEV" # kernel refuses lane judgements without it

DOMAINS="billing ops infra ui fiscal memory"
DOMAIN_RULER_billing="a"; DOMAIN_RULER_ops="a"; DOMAIN_RULER_infra="a"; DOMAIN_RULER_fiscal="a"
DOMAIN_RULER_ui="b"; DOMAIN_RULER_memory="a b"

EXTERNAL_AUTHORITIES="tax=PRIYA revenue_recognition=SAM" # humans outside the two devs who own a verdict; name them

# == 2. SHARED REFERENCE (kernel K1) ==
# "The copy both parties publish to." Here: a git remote branch.

PF_REF_NAME="origin/main"
PF_REF_SYNC='git fetch --quiet origin'; PF_REF_DIRTY='git status --porcelain'
PF_REF_BEHIND='git rev-list --count HEAD..origin/main'; PF_REF_AHEAD='git rev-list --count origin/main..HEAD'
PF_REF_AHEAD_LIST='git log --format="%h %an %s" origin/main..HEAD'; PF_REF_AUTHORS='git log --format="%an" HEAD..origin/main | sort -u'

# "Behind" must not fire mid-merge or atop unreconciled new work - test "at rest", not "how far behind".
PF_REF_AT_REST='test ! -e .git/MERGE_HEAD -a ! -d .git/rebase-merge -a ! -d .git/rebase-apply \
 -a "$(git rev-list --count origin/main..HEAD)" = 0 -a -z "$(git status --porcelain)"'
PF_REF_AHEAD_FOREIGN='git log --format="%an" origin/main..HEAD | sort -u | grep -v "^Alex Rivera$\|^Bao Nguyen$"' # a push isn't bounded by your pathspec

# == 3. SHARED MUTABLE QUEUE (kernel K2) ==
# An ordered set of pending mutations a third party applies AS A LOT. Here: SQL migrations, lexical filename order.

PF_QUEUE_KIND="sql-migrations"; PF_QUEUE_ORDER="lexical-filename"
PF_QUEUE_DIR="db/migrations"; PF_QUEUE_STAGING="db/migrations/_draft"

PF_QUEUE_LOCAL='ls db/migrations/*.sql 2>/dev/null | xargs -n1 basename'
PF_QUEUE_REF='git ls-tree origin/main db/migrations/ --name-only | sed "s|.*/||" | grep "\.sql$"'
PF_QUEUE_TARGET='ssh deploy@app.example.com "ls /srv/acme/db/migrations/*.sql | xargs -n1 basename"'
PF_QUEUE_APPLIED='ssh deploy@app.example.com "cd /srv/acme && php scripts/run-migrations.php --status"' # a count from one place is a claim, never trust alone

# Filename initial = declared author; proven by md5(local)==md5(ref)==md5(target), never git blame
PF_QUEUE_AUTHOR_RE='^[0-9]\{12\}_\([ab]\)_'
PF_QUEUE_AUTHOR_PROOF='md5sum'

PF_QUEUE_FOREIGN_ACTION="STOP" # a bare run = whole lot
PF_QUEUE_HOLD_MECHANISM="db/.mig-hold"

# == 4. GLOBAL NAMESPACES (kernel K3) ==
# A sandbox proves syntax/behaviour, never uniqueness in a global namespace - the colliding object is what the sandbox left out.

PF_DB_SCHEMA="acme"

PF_NS_CLASSES="constraint trigger event"
PF_NS_SCOPE_constraint="schema"; PF_NS_SCOPE_trigger="schema"; PF_NS_SCOPE_event="schema" # FK *and* CHECK - NOT per table

PF_NS_DECLARED_constraint='grep -oiE "CONSTRAINT[[:space:]]+`?[A-Za-z0-9_]+`?" "$F" | awk "{print \$NF}" | tr -d "\`"' # trigger/event: same shape, swap the keyword

PF_NS_TAKEN='ssh deploy@app.example.com "cd /srv/acme && php scripts/list-global-names.php acme"' # probe of the real schema

PF_NS_FALLBACK='grep -hoiE "CONSTRAINT[[:space:]]+`?[A-Za-z0-9_]+`?" db/migrations/*.sql | awk "{print \$NF}" | tr -d "\`" | sort -u' # offline lower bound: under-reports, never over
PF_NS_FALLBACK_IS_PROOF="no"

PF_NS_CONVENTION_constraint="fk_<table-abbrev>_<col> / chk_<table-abbrev>_<rule>, abbrev UNIQUE across the schema"

# == 5. DECLARED SUBJECT vs CREATED OBJECTS (kernel K-drift) ==
PF_DRIFT_SLUG_RE='s/^[0-9]\{12\}_[ab]_//; s/[-_].*$//'
PF_DRIFT_CREATED='grep -oiE "CREATE[[:space:]]+TABLE([[:space:]]+IF[[:space:]]+NOT[[:space:]]+EXISTS)?[[:space:]]+`?[A-Za-z0-9_]+`?" "$F" | awk "{print \$NF}" | tr -d "\`"'
PF_DRIFT_ACTION="WARN" # duplicate intent is sometimes right; unseen never is

# == 6. DEPLOY TARGET ==
PF_TARGET_HOST="deploy@app.example.com"; PF_TARGET_PATH="/srv/acme"
PF_DEPLOY_CMD="bin/deploy.sh --apply"; PF_DEPLOY_SOURCE="origin/main"; PF_DEPLOY_VERIFY="bin/deploy.sh --verify"

PF_DEPLOY_BLIND="deletions" # no --delete => a rename ships the new file and LEAVES the old; "--verify: no drift" can be true anyway
PF_DEPLOY_ORPHAN_CHECK='comm -13 <(git ls-files public app db scripts | sort) <(ssh deploy@app.example.com "cd /srv/acme && find public app db scripts -type f" | sort)'

PF_TARGET_UNCOVERED="/opt/acme-pipeline /etc/cron.d /etc/logrotate.d" # not covered by deploy.sh

# == 7. OWNERSHIP (kernel K4) ==
PF_OWNERSHIP_MAP="claude-brain/OWNERSHIP.map"
PF_OWNERSHIP_PROSE="docs/ONBOARDING.md" # optional; named in a WARN when the map is absent
PF_OWNERSHIP_SINCE="2026-01-01"; PF_DATA_LANE_PREFIX="table:"
PF_OWNERSHIP_CONTENT_PATHS="app public scripts lib db" # where a data lane is attributed FROM; empty = whole repo

# THE AXIS IS THE CONCERN, NOT THE FILE - a per-file map blocks a legitimate cross-concern change.
PF_CONCERNS="logic schema style nav access fiscal environment-constant"
PF_RATIFY_TOKEN="RATIFIED:"; PF_RATIFY_ACTION="RECORD" # never BLOCK - a receipt, not a gate

PF_SHARED_TOOLS="bin/deploy.sh scripts/run-migrations.php app/db.php app/auth.php app/settings.php \
 claude-brain/pm-kit/doctor.sh claude-brain/pm-sync.sh claude-brain/bootstrap.sh"
PF_SHARED_TOOL_ACTION="WARN+HANDOFF"; PF_SHARED_TOOL_REQUIRE="os,host,interpreter-version tested on"

PF_ENV_CONSTANTS="203.0.113.10 10.0.0.4 deploy@ /srv/acme /opt/acme-pipeline" # grep the repo when one changes

# == 8. CLAIMS - the in-flight layer (kernel K5) ==
PF_CLAIMS_FILE="claude-brain/CLAIMS.tsv"
PF_CLAIMS_FORMAT="state<TAB>opened<TAB>dev<TAB>slug<TAB>globs<TAB>note"
PF_CLAIMS_MERGE="union" # dedupe by slug, last wins
PF_CLAIM_STALE_DAYS="3"

# == 9. ARBITRATION / OPEN DECISIONS (kernel K6) ==
PF_ARB_FILE="claude-brain/agents/pm-memory/dev-handoff-register.md"
PF_ARB_HEADER_RE='^### H-20'; PF_ARB_ID_RE='H-[0-9]\{8\}-[ab]-[a-z0-9-]\+'
PF_ARB_DATE_FROM="id" # NEVER a hand-maintained "- N d" field - it rots
PF_ARB_WARN_DAYS="3"; PF_ARB_STOP_DAYS="7"; PF_ARB_DELETE_FIELD="- N d"
PF_ARB_ESCALATION="ticket, HUMAN-created"; PF_ARB_PM_MAY_CREATE="no"

PF_DEBT_FILE="claude-brain/agents/pm-memory/scrapping-backlog.md" # 2nd store; an EMPTY gate = unscheduled decision, not debt
PF_DEBT_REQUIRE_FIELDS="id owner opened gate"
PF_DEBT_EMPTY_GATE_ACTION="surface with arbitration, not the debt backlog"

# == 10. POST-MERGE COHERENCE (kernel K7) ==
# A clean merge proves the two sides didn't edit the same LINES, nothing about meaning.

# K7a - couplings carried by a STRING LITERAL, not a resolved symbol. Grow
# from real incidents ONLY. format: name | emitter-glob | consumer-glob | extractor-kind
PF_COUPLINGS="
css-class-js-selector | src/views/*.php;src/css/*.css | src/js/*.js | class-literal
enum-value-allowlist | db/migrations/*.sql | src/views/*.php | quoted-enum
helper-name-callers | app/*.php | src/views/*.php | php-function
"
PF_COUPLING_ACTION="STOP" # empty intersection post-merge is fatal

# K7b - semantic duplicate. Search by BEHAVIOUR and CALLER, never by name.
PF_DUP_PROBES="
new-symbols-with-overlapping-callers
new-symbols-touching-the-same-table
"
PF_DUP_REGISTRIES="ref_pages system_settings ref_access_preset_pages"
PF_DUP_ACTION="WARN" # duplication is sometimes right; being unseen never is

# == 11. MEMORY (kernel memory tiers) ==
# Only PM_DOCTOR is read by pm-preflight.sh (P7); the rest belongs to the
# wider pm-kit's doctor.sh/hygiene tooling (outside this port), kept for a complete map.
PM_T0_INDEX="claude-brain/agents/pm-memory.md"
PM_T1_STATE="claude-brain/agents/pm-state.md"; PM_T2_RAILS="claude-brain/pm-kit/state/RAILS-BY-ARTEFACT.tsv" # generated
PM_T2_TOPICS="claude-brain/agents/.pm-cache/TOPICS.tsv" # generated
PM_T2_SHIPPED="claude-brain/agents/pm-memory/shipped-arcs-register.md"
PM_T3_DIR="claude-brain/agents/pm-memory"; PM_T4_ARCHIVE="claude-brain/agents/pm-memory/index-relocated-detail"

PM_READ_CAP="98304"; PM_T0_ADMIT_PCT="55"; PM_T0_PASS_PCT="70" # % thresholds are of the read cap, measured for your harness
PM_T0_GATE_PCT="90" # no recording until a hygiene pass runs <- must GATE
PM_T0_OUTAGE_PCT="100"; PM_T0_LINE_MAX="1536"; PM_T0_ARCLINE_MAX="350"; PM_T3_FILE_MAX="81920"
PM_T3_DIR_MAX_FILES="12"; PM_REGISTER_MAX="30720"; PM_DORMANT_DAYS="90"; PM_ARCHIVE_MAX="3"
PM_REFILL_KB_PER_DAY="9"; PM_PASS_INTERVAL_DAYS="4" # bound the INPUT, not the output

PM_HYGIENE_LOCK="claude-brain/agents/.pm-hygiene.lock" # serialise passes - concurrent ones clobber each other's lines
PM_HYGIENE_WRITE_MODE="section-scoped"; PM_HYGIENE_REREAD_BEFORE_EACH_WRITE="yes"

PM_DOCTOR="claude-brain/pm-kit/doctor.sh"; PM_DOCTOR_STRICT_ABOVE_PCT="90"
PM_T0_IS_SHARED_LIVE="yes" # shared with the other dev's live session - a careless write loses data no commit holds

# == 12. PROJECT-SPECIFIC CHECKS ==
# Meaningless outside acme; must NOT migrate into the kernel.
PF_EXTRA_CHECKS="profiles/acme/checks.d/90-derivation-tree.sh profiles/acme/checks.d/91-fiscal-fence.sh"

PF_SOT_CHAIN="intake -> containers/formats -> sku-activation -> SKU -> cost-of-goods" # 90: refuse a table duplicating a fact already owned
PF_SOT_RULE="derive by FK, never by string copy"

PF_FISCAL_SEAL_READ="v_period_closed + v_period_close_watermark, fail-closed" # 91: refuse writes into a sealed period
PF_FISCAL_SEAL_AUTHORITY="ledger-of-record"; PF_FISCAL_NON_FISCAL_ARCS="ops-telemetry ticketing qa planning"

# == 14. ARTEFACT-KEYED RAILS (kernel/rails-index.sh) ==
# Recall-by-ADDRESS not -ASSOCIATION: a rail NAMEABLE by its violation surface
# (table/file/column/symbol) is keyed by that name, so a pre-flight touching
# it greps directly instead of a human having to remember.

PF_PM_INDEX="claude-brain/agents/pm-memory.md" # same file as PM_T0_INDEX (S11), named separately - kernel mustn't assume that token exists

# Name a directory glob too if the corpus file might later split into
# per-topic files. Rails registers only, never build-state/open-question ones.
PF_RAILS_EXTRA_CORPUS="claude-brain/agents/pm-memory/rails-register.md claude-brain/agents/pm-memory/rails-register/*.md"

# Table-name prefixes this schema uses - derive from information_schema, not
# a doc's prose list. EXCLUDE prefixes whose COLUMN names collide with it.
PF_ARTEFACT_TABLE_RE="^(ref|inv|ord|crm|bd|op|fin|doc|sales|kpi|system)_[A-Za-z0-9_]+$"
PF_ARTEFACT_FILE_RE="[.](php|js|sh|css|sql|ts|py|md|json|yml|yaml)$" # kernel default is identical minus any house extension

# Severity markers, LONGEST-FIRST. A fragment starting with none of these gets INFO.
PF_SEVERITY_MARKERS="⛔|STOP
🔴🔴🔴|STOP
🔴🔴|STOP
🔴|STOP
⚠️|WARN"

PF_RAILS_TRUNCATE="300"
PF_RAILS_OUTPUT="claude-brain/pm-kit/state/RAILS-BY-ARTEFACT.tsv" # generated
PF_ARTEFACT_GRAPH_CACHE="claude-brain/pm-kit/state/artefact-graph.tsv"

# Transitive view-dependency closure (a table rail must also fire for every
# view, direct or transitive, reading it). Cached; only called with --refresh-graph.
PF_ARTEFACT_EXPAND='ssh deploy@app.example.com "cd /srv/acme && php scripts/list-view-table-usage.php"'
PF_ARTEFACT_EXPAND_MAX_ITER="25" # anti-cycle bound, per-row BFS

# == 15. WHAT THIS PROFILE HAS NOT BEEN VERIFIED AGAINST ==
# A worked example, not a tested profile: PF_QUEUE_TARGET, PF_QUEUE_APPLIED, PF_NS_TAKEN,
# PF_DEPLOY_ORPHAN_CHECK, PF_ARTEFACT_EXPAND assume a real host/database - replace with
# commands that reach yours, and treat each as UNRUN until executed once.
