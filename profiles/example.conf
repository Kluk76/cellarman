# -----------------------------------------------------------------------------
# profiles/example.conf - a worked EXAMPLE profile for the cellarman kit.
#
# This file is the ONLY place project nouns are allowed: the scripts carry none.
# It is sourced by pm-preflight.sh, ownership-lint.sh, rails-index.sh, claim.sh
# and lint-claims-session.sh (doctor.sh reads a few values from it). POSIX sh
# only: it sources under macOS bash 3.2 and bash 5. Copy it, rename it, replace
# every "acme" value.
#
# THE RULE FOR THIS FILE: every variable below is read by at least one script,
# or sits in section 12 ("read by the PM agent, not by any script"). A variable
# that nothing reads is configuration that does nothing, and a stranger fills it
# in carefully anyway; tests/smoke.sh fails when this file and the scripts
# disagree, in either direction. Add a variable here in the same commit that
# makes a script read it.
#
# An EMPTY value means "not declared": the phase that needs it prints n/a and
# measures nothing. A DECLARED value whose target cannot be reached is reported
# as UNMEASURED (exit 1), never as a pass.
# -----------------------------------------------------------------------------

# == 1. TEAM ==
# DEVS: the developer initials (claim.sh refuses an initial not in this list;
# ownership-lint --refresh counts commits per developer).
# DEV_<id>: "<display name>|<vcs author regex>" - the regex (field 2) attributes
# commits to a developer in `ownership-lint.sh --refresh`; further fields are ignored.
DEVS="a b"
DEV_a="Alex Rivera|^Alex Rivera$"
DEV_b="Bao Nguyen|^Bao Nguyen$"

# The environment variable that holds the acting developer's initial. There is no
# fallback to $USER: under sudo that would record a shared account. (When this
# variable is unset the kit scripts default to a variable named PM_DEV.)
DEV_ENV_VAR="ACME_DEV"

# == 2. SHARED REFERENCE ==
# "The copy both parties publish to." Here: a git remote branch. Without that
# remote (a solo clone, or the branch not pushed yet) the pre-flight says
# "single-clone mode" once and marks every comparison against it n/a.
PF_REF_NAME="origin/main"

# == 3. SHARED QUEUE ==
# An ordered set of pending changes a third party applies AS A LOT. Here: SQL
# migrations in lexical filename order. Empty PF_QUEUE_DIR = no queue: P2, P3 and
# P4 print n/a.
PF_QUEUE_DIR="db/migrations"
# The staging directory (drafts not yet promoted): listed because promotion
# usually sweeps the whole directory.
PF_QUEUE_STAGING="db/migrations/_draft"
# sed capture: the author initial inside a queue file name, to say whose a
# change is when it is on the shared reference and not on your disk.
PF_QUEUE_AUTHOR_RE='^[0-9]\{12\}_\([ab]\)_'
# A COMMAND that prints the queue file names present on the deploy target. It runs
# only with --probe-db. Leave empty to fall back to `ssh $PF_TARGET_HOST ls
# $PF_TARGET_PATH/$PF_QUEUE_DIR/*.sql`; with neither declared the target leg is n/a.
PF_QUEUE_TARGET='ssh deploy@app.example.com "ls /srv/acme/db/migrations/*.sql | xargs -n1 basename"'

# == 4. GLOBAL NAMESPACES (P3) ==
# A sandbox proves syntax and behaviour, never uniqueness in a global namespace:
# the colliding object is exactly what the sandbox left out.
# PF_DB_SCHEMA names the schema in P3's messages. PF_NS_TAKEN is a COMMAND, run
# only with --probe-db, that prints the names already taken in the real schema.
# Without it P3 falls back to a lower bound taken from the queue itself (names
# declared in earlier files) and says so.
PF_DB_SCHEMA="acme"
PF_NS_TAKEN='ssh deploy@app.example.com "cd /srv/acme && php scripts/list-global-names.php acme"'

# == 5. DECLARED SUBJECT vs CREATED OBJECTS (P4) ==
# A sed SCRIPT reducing a queue file's basename (no .sql) to its subject word,
# compared with the tables the file creates. Kernel default accepts any single
# lowercase initial.
PF_DRIFT_SLUG_RE='s/^[0-9]\{12\}_[ab]_//; s/[-_].*$//'

# == 6. DEPLOY TARGET ==
# Used by the P2 fallback above. Leave PF_TARGET_HOST empty if you deploy nowhere.
PF_TARGET_HOST="deploy@app.example.com"
PF_TARGET_PATH="/srv/acme"

# == 7. OWNERSHIP ==
PF_OWNERSHIP_MAP="claude-brain/OWNERSHIP.map"
# Optional prose document, named in the message when the map is absent.
PF_OWNERSHIP_PROSE="docs/ONBOARDING.md"
# ownership-lint --refresh: count commits since this date; a lane named
# "<prefix><name>" is a DATA lane attributed by CONTENT in the paths listed.
PF_OWNERSHIP_SINCE="2026-01-01"
PF_DATA_LANE_PREFIX="table:"
PF_OWNERSHIP_CONTENT_PATHS="app public scripts lib db"   # empty = the whole repo
# A cross-concern write is waved through by a receipt (commit message or
# --ratified) starting with this token. RECORD = note it and list the lanes
# crossed; BLOCK = the block stands whatever the receipt says.
PF_RATIFY_TOKEN="RATIFIED:"
PF_RATIFY_ACTION="RECORD"
# Files that carry environment-dependent constants and that only their author has
# ever exercised: touching one is a handoff event, not a commit (P5).
PF_SHARED_TOOLS="bin/deploy.sh scripts/run-migrations.php app/db.php"

# == 8. CLAIMS, SESSIONS, HOOKS ==
PF_CLAIMS_FILE="claude-brain/CLAIMS.tsv"
# Days after which a live claim is flagged "close it or restate it".
PF_CLAIM_STALE_DAYS="3"
# Claim states that count as LIVE: an added row in one of these states must carry
# a session field or the pre-commit gate refuses it. Space-separated.
PF_CLAIM_LIVE_STATES="open restated"
# 1 = claim.sh pushes after committing (it still refuses when the branch carries
# other unpushed work). 0 = commit only; the developer pushes. Same as --push.
PF_CLAIM_PUSH="0"
# Environment variable holding the id of the current agent session. Its first 8
# characters, behind the prefix below, form field 7 of a claim row: claim.sh writes
# it, ownership-lint derives the same value to recognise "mine".
PF_SESSION_ENV_VAR="CLAUDE_CODE_SESSION_ID"
# Prefix of that field. May be empty, but then keep it empty on every clone: the
# two sides must agree. (Same value as ${SESSION_PREFIX} in the agent file.)
PF_SESSION_PREFIX="acme-"
# Directory holding the git hooks (repo-relative). The pre-flight checks that
# core.hooksPath points at it, since a hook cannot detect its own absence.
PF_HOOKS_PATH=".githooks"

# == 9. ARBITRATION (open decisions between developers) ==
PF_ARB_FILE="claude-brain/agents/acme-pm-memory/dev-handoff-register.md"
# ERE (read by awk) matching the HEADER line of an item, and the id inside it. Write
# the date out, no {8}: mawk has no interval expressions. Defaults: "^### " and any
# lowercase initial. The age is computed from the first 8 digits of the id.
PF_ARB_HEADER_RE='^### H-20'
PF_ARB_ID_RE='H-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[ab]-[a-z0-9-]+'
# Closure words accepted right after the " · " separator of a header (read by the
# pre-flight AND the doctor). Default: CLOSED|DONE|RESOLVED|ANSWERED|OBSOLETE.
PF_ARB_CLOSED_RE='CLOSED|DONE|RESOLVED|ANSWERED|OBSOLETE'
# Optional: an ERE matching a hand-maintained age in a header, e.g. '· [0-9]+ d'.
# When set, a declared age that disagrees with the computed one is flagged STALE.
# PF_ARB_DECLARED_AGE_RE='· [0-9]+ d'
# Open items age from their id: >= WARN_DAYS is a WARN, >= STOP_DAYS is an
# AMBIENT warning (marked [ambient], never exit 2: the register is checked on every
# run, so one stale item must not freeze unrelated builds). What happens to such an
# item is policy, and policy lives in the agent file (${ESCALATION_POLICY}).
PF_ARB_WARN_DAYS="3"
PF_ARB_STOP_DAYS="7"
# A second register (debt or retirement backlog). P6 flags open items that declare
# an empty gate. Item format: a line "#<n> - <title> ... OPEN" and, on that line,
# "gate: none". Leave empty if you keep no such file.
PF_DEBT_FILE="claude-brain/agents/acme-pm-memory/debt-backlog.md"

# == 10. MEMORY ==
# The always-read index; rails-index mines it, the doctor measures it. MUST name
# the same file as PM_INDEX in pm-kit.conf (that one is absolute, this one is
# relative to the repo root); the doctor FAILs when the two disagree.
PF_PM_INDEX="claude-brain/agents/acme-pm-memory.md"
# The memory doctor the pre-flight delegates to (P7).
PM_DOCTOR="claude-brain/pm-kit/doctor.sh"
# Files and directories that are the PM's memory (space-separated, repo-relative).
# Default: PF_PM_INDEX and the directory of the same name without ".md".
# Used by the "code commits since the last memory commit" check.
PF_MEMORY_PATHS="claude-brain/agents/acme-pm-memory.md claude-brain/agents/acme-pm-memory"
# Warn when this many code commits sit on the branch since the last memory commit.
# 0 turns the check off. Default 10.
PF_MEMORY_COMMIT_WARN="10"

# == 11. ARTEFACT-KEYED RAILS (rails-index.sh, pre-flight P8) ==
# Recall by ADDRESS, not by association: a rail NAMEABLE by its violation surface
# (table, file, column, symbol) is keyed by that name, so a pre-flight touching the
# surface greps it directly instead of a human having to remember.

# Extra files to mine besides the index; DEFAULT EMPTY. One line per entry, each
# line a space-separated list of patterns relative to the repo root. EVERY pattern
# must match at least one file: an unresolved pattern STOPs rails-index.sh and is
# named, never skipped. Rails registers only, never build-state ones.
PF_RAILS_EXTRA_CORPUS=""

# Table-name prefixes this schema uses (derive from the database, not from a doc's
# prose). EXCLUDE prefixes whose COLUMN names collide with it.
PF_ARTEFACT_TABLE_RE="^(ref|inv|ord|crm|bd|op|fin|doc|sales|kpi|system)_[A-Za-z0-9_]+$"
# What counts as a file artefact. The kernel default is identical to this value.
PF_ARTEFACT_FILE_RE="[.](php|js|sh|css|sql|ts|py|md|json|yml|yaml)$"

# Severity markers, LONGEST-FIRST; format "<marker>|<level>". A fragment starting
# with none of these gets INFO. Severity means ACTION REQUIRED, not importance:
# mapping every "important" marker to STOP saturated the origin project's
# pre-flight (86% of artefacts carried one; exit 2 on ~6 consults in 7), and
# "always red" and "always green" produce the same reader behaviour: overriding by
# reflex. Reserve STOP for the marker that means "forbidden"; everything else is a
# WARN to enumerate. The miner binds severity to a fragment's HEAD marker only
# (record head, or right after the " · " separator); a marker mid-sentence is
# prose emphasis and neither splits nor classifies.
PF_SEVERITY_MARKERS="⛔|STOP
🔴🔴🔴|WARN
🔴🔴|WARN
🔴|WARN
⚠️|WARN"

PF_RAILS_TRUNCATE="300"
PF_RAILS_OUTPUT="claude-brain/pm-kit/state/RAILS-BY-ARTEFACT.tsv"   # generated

# Governance paths appended to the pre-flight's measured population on EVERY run
# (deduped against the caller's --paths). A caller names the build's own files, not
# the kit's governance surface, but an omitted governance path is a DIFFERENT,
# weaker population, not a partial one. A STOP that comes only from one of these
# is reported as a WARN marked [ambient]. Optional; empty = none.
PF_ALWAYS_PATHS="claude-brain/OWNERSHIP.map claude-brain/CLAIMS.tsv claude-brain/agents/acme-pm-memory/dev-handoff-register.md"

# Transitive view-dependency closure (a table rail must also fire for every view,
# direct or transitive, reading it). PF_ARTEFACT_EXPAND is a COMMAND printing
# "<table><TAB><view>" edges; the result is cached in PF_ARTEFACT_GRAPH_CACHE and
# refreshed only by `rails-index.sh --refresh-graph`. Neither declared = n/a;
# declared but never refreshed = UNMEASURED (exit 1).
PF_ARTEFACT_GRAPH_CACHE="claude-brain/pm-kit/state/artefact-graph.tsv"
PF_ARTEFACT_EXPAND='ssh deploy@app.example.com "cd /srv/acme && php scripts/list-view-table-usage.php"'
PF_ARTEFACT_EXPAND_MAX_ITER="25"   # anti-cycle bound, per-row BFS

# == 12. READ BY THE PM AGENT, NOT BY ANY SCRIPT ==
# Variables the kernel or the README tells the PM agent itself to read would live
# here, between the two markers below, and nowhere else. tests/smoke.sh exempts
# exactly this block from its "every variable is read by a script" rule. Today the
# kernel names no profile variable for the agent (it reads its bindings table), so
# the block is empty on purpose.
# --- agent-read: begin ---
# --- agent-read: end ---

# == ENVIRONMENT (not profile variables; shown for completeness) ==
#   PM_REPO_ROOT          repo root override, for scripts run outside the repo
#   PM_PROFILE            path to a profile, or a name under <kit>/profiles/
#   PM_KIT_CONF           alternative pm-kit.conf for pm-sync / session-ledger
#   PM_KIT_DIR            kit directory override for pm-sync / the example hook
#   PM_SYNC_MSG           pm-sync commit message override
#   PM_SYNC_NO_DOCTOR=1   skip pm-sync's advisory doctor call
#   PM_SYNC_NO_FLOCK=1    force pm-sync's mkdir lock even where flock exists (testing)
#   PM_GATE_MEMORY_PATHS  the report-back gate's memory paths, when it runs outside pm-kit.conf
#   PM_AGENT_NAME         the PM agent's name, for the consult-nudge hook (or its first argument)
#
# MEMORY PATHS for pm-sync and session-ledger are NOT configured here: they read
# pm-kit.conf (PM_MEMORY_DIR, PM_INDEX and the optional PM_SYNC_EXTRA_PATHS).
# Budgets, the load log, the archive and the dormancy window live there too.
